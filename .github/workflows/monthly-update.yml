name: Monthly Update

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual runs from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: node node_modules/puppeteer/install.js

      - name: Generate game data and update version
        run: npm run generate

      - name: Build
        run: npm run build

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            src/index.ts \
            src/GameData/CharDefaults.ts \
            src/GameData/Flags.ts \
            src/GameData/GlobalKeys.ts \
            CoC2SaveEditor.html
          git commit -m "chore: monthly update $(date +'%Y-%m-%d')"
          git push

      - name: No changes detected
        if: steps.diff.outputs.changed != 'true'
        run: echo "No changes detected, skipping commit."
